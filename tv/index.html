<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tournoi DartLab</title>
  <meta name="description" content="Tableau du tournoi DartLab en direct : matchs en cours, poules et phase finale.">
  <style>
    :root { --bg: #0E0C0B; --card: #181614; --card2: #211E1B; --line: #2E2A26; --text: #F2ECE1; --muted: #B8B1A6; --dim: #7A736A;
            --red: #B53A2C; --gold: #FFD940; --green: #6BBF59; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
                 font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    body { font-size: clamp(12px, 1.05vw, 26px); overflow: hidden; }
    .wrap { height: 100vh; display: flex; flex-direction: column; padding: 1.6vw 2vw; gap: 1.4vw; }
    header { display: flex; align-items: center; gap: 1.2vw; }
    header svg { width: 3.6vw; height: 3.6vw; min-width: 40px; min-height: 40px; }
    .brand { font-weight: 900; letter-spacing: .25em; font-size: 1.6em; }
    .title { flex: 1; }
    .title b { display: block; font-size: 1.9em; letter-spacing: .04em; }
    .title span { color: var(--muted); }
    .join { text-align: right; color: var(--muted); }
    .join b { display: block; font-size: 2.4em; color: var(--gold); letter-spacing: .25em; font-weight: 900; }
    main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.15fr 1fr; gap: 1.4vw; }
    .col { min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 1vw; }
    .fit { transform-origin: top left; }
    h2 { margin: 0 0 .5em; font-size: .9em; letter-spacing: .3em; color: var(--dim); font-weight: 800; }
    h2.live { color: var(--red); }
    h2.live::before { content: "●"; margin-right: .5em; animation: blink 1.4s infinite; }
    @keyframes blink { 50% { opacity: .25; } }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 1vw; padding: 1vw 1.3vw; }
    .match { margin-bottom: 1vw; }
    .match .head { display: flex; justify-content: space-between; color: var(--muted); font-size: .9em; margin-bottom: .6em; }
    .duel { display: grid; grid-template-columns: 1fr 1fr; gap: 1vw; }
    .side { background: var(--card2); border-radius: .8vw; padding: .8vw 1vw; border: 2px solid transparent; }
    .side.turn { border-color: var(--gold); }
    .side .name { font-weight: 700; font-size: 1.3em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .side.turn .name::after { content: " ◀"; color: var(--gold); font-size: .8em; }
    .side .score { font-weight: 900; font-size: 3.6em; line-height: 1.05; letter-spacing: .02em; }
    .side .sub { color: var(--muted); min-height: 1.3em; }
    .side .volley { color: var(--muted); font-size: .95em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .side .volley.old { opacity: .55; }
    .row { display: flex; align-items: center; gap: .8em; padding: .45em 0; border-bottom: 1px solid var(--line); }
    .row:last-child { border-bottom: 0; }
    .row .n { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
    .row .n.r { text-align: right; }
    .row .vs { color: var(--dim); font-size: .8em; }
    .win { color: var(--gold); }
    .lose { color: var(--dim); }
    .fit > div + div { margin-top: 1.4vw; }
    .tag { font-size: .75em; font-weight: 800; letter-spacing: .1em; padding: .15em .6em; border-radius: 99px; background: var(--red); color: var(--text); }
    table { width: 100%; border-collapse: collapse; }
    td { padding: .35em .3em; border-bottom: 1px solid var(--line); }
    tr:last-child td { border-bottom: 0; }
    td.pos { color: var(--dim); width: 1.6em; font-weight: 800; }
    td.st { text-align: right; color: var(--muted); white-space: nowrap; }
    tr.q td.nm { color: var(--gold); }
    .pools { display: grid; grid-template-columns: repeat(auto-fill, minmax(16em, 1fr)); gap: 1vw; }
    .bracket { display: flex; gap: 1vw; }
    .round { flex: 1; display: flex; flex-direction: column; justify-content: space-around; gap: .6vw; min-width: 0; }
    .round h3 { margin: 0 0 .3em; font-size: .8em; letter-spacing: .2em; color: var(--dim); text-align: center; }
    .bm { background: var(--card); border: 1px solid var(--line); border-radius: .6vw; padding: .3em .7em; }
    .bm.on { border-color: var(--red); }
    .bm .rest { float: right; font-weight: 400; font-size: .85em; color: var(--dim); }
    .bm div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: .12em 0; font-weight: 600; }
    .champion { text-align: center; padding: 2vw; border: 2px solid var(--gold); background: rgba(255,217,64,.07); }
    .champion .cup { font-size: 4em; }
    .champion b { display: block; font-size: 3.4em; font-weight: 900; }
    .champion span { color: var(--muted); font-size: 1.4em; }
    .empty { color: var(--dim); padding: 1em 0; }
    .status { position: fixed; bottom: .8vw; right: 1.2vw; color: var(--dim); font-size: .8em; }
    /* Saisie du code */
    .ask { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 16px; text-align: center; }
    .ask input { font-size: 44px; letter-spacing: 10px; text-align: center; width: min(360px, 100%); padding: 10px; border-radius: 12px;
                 border: 2px solid var(--red); background: var(--card); color: var(--text); text-transform: uppercase; font-weight: 800; }
    .ask button { font-size: 20px; padding: 14px 40px; border-radius: 12px; border: 0; background: var(--red); color: var(--text); font-weight: 800; cursor: pointer; }
    .ask p { color: var(--muted); max-width: 520px; line-height: 1.5; font-size: 17px; }
    .err { color: #ff7b6b; font-weight: 700; }
    @media (max-width: 900px) { body { overflow: auto; font-size: 14px; } .wrap { height: auto; } main { grid-template-columns: 1fr; } .fit { transform: none !important; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    // Écran télé d'un tournoi partagé DartLab : lit le tableau avec le seul code (fonction tournament_board), toutes les 4 s.
    const SUPABASE_URL = 'https://rjbdlcocsqxbdlyeoefm.supabase.co';
    const KEY = 'sb_publishable_QRQYj-0XDm1j6EB0tBs-3g_zHVcfR6v'; // clé publique (lecture limitée par les règles du serveur)
    const GAMES = { x01: 'X01', cricket: 'Cricket', shanghai: 'Shanghai', horloge: "Tour de l'horloge", boussole: 'La Boussole', parcours: 'Parkour', killer: 'Killer' };
    const FORMATS = { knockout: 'Élimination directe', pool: 'Poule unique', pools: 'Poules + phase finale' };
    const LOGO = '<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="46" cy="54" r="34" fill="#B53A2C"/><circle cx="46" cy="54" r="30" fill="#0E0C0B"/><circle cx="46" cy="54" r="22" fill="none" stroke="#F2ECE1" stroke-width="3"/><circle cx="46" cy="54" r="14" fill="#B53A2C"/><circle cx="46" cy="54" r="7" fill="#F2ECE1"/><circle cx="46" cy="54" r="3" fill="#B53A2C"/><path d="M 49 51 L 76 24" stroke="#FFD940" stroke-width="3.4" stroke-linecap="round"/><path d="M 76 24 L 86 22 L 80 30 Z M 76 24 L 78 14 L 70 20 Z" fill="#FFD940"/></svg>';

    const app = document.getElementById('app');
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const params = new URLSearchParams(location.search);
    const code = (params.get('c') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);

    // ─── Mêmes règles que l'appli (src/games/tournament.js) ───
    function poolStandings(t, pool) {
      const rows = pool.players.map((name, seed) => ({ name, seed, played: 0, wins: 0, rest: 0, h2h: 0 }));
      const by = Object.fromEntries(rows.map(r => [r.name, r]));
      const ms = pool.matchIds.map(id => t.matches[id]);
      for (const m of ms) {
        if (!m.winner) continue;
        by[m.a].played++; by[m.b].played++; by[m.winner].wins++;
        if (typeof m.detail?.rest === 'number') by[m.winner === m.a ? m.b : m.a].rest += m.detail.rest;
      }
      for (const r of rows) {
        const g = rows.filter(o => o.wins === r.wins).map(o => o.name);
        r.h2h = ms.filter(m => m.winner === r.name && g.includes(m.a) && g.includes(m.b)).length;
      }
      return rows.sort((x, y) => (y.wins - x.wins) || (y.h2h - x.h2h) || (x.rest - y.rest) || (x.seed - y.seed));
    }
    function roundLabel(t, i) {
      const n = t.knockout.rounds[i].length;
      if (t.knockout.title === 'Barrage') return n === 1 ? 'Barrage' : `Barrage – tour ${i + 1}`;
      return { 1: 'Finale', 2: 'Demi-finales', 4: 'Quarts', 8: 'Huitièmes', 16: 'Seizièmes' }[n] ?? `Tour ${i + 1}`;
    }
    const playable = (t) => t.order.map(id => t.matches[id]).filter(m => m.a && m.b && !m.winner);
    const progress = (t) => { const r = Object.values(t.matches).filter(m => !m.bye); return [r.filter(m => m.winner).length, r.length]; };
    const stageOf = (t, m) => m.stage === 'pool' ? (t.pools.find(p => p.id === m.poolId)?.name ?? 'Poule') : roundLabel(t, m.round);

    // ─── Affichage ───
    const nameCls = (m, n) => m.winner ? (m.winner === n ? 'win' : 'lose') : '';

    function liveCard(t, entry) {
      const m = t.matches[entry.match];
      const l = entry.live;
      if (!m || m.winner || !l?.players) return '';
      const sides = l.players.map((p, i) => `
        <div class="side ${i === l.current ? 'turn' : ''}">
          <div class="name">${esc(p.name)}</div>
          <div class="score">${esc(p.score)}</div>
          <div class="sub">${esc(p.sub)}</div>
          ${(p.volleys || []).map((v, vi) => `<div class="volley${vi ? ' old' : ''}">${esc(v)}</div>`).join('')}
        </div>`).join('');
      return `<div class="card match"><div class="head"><span>${esc(stageOf(t, m))}</span><span>${esc(l.detail)}</span></div><div class="duel">${sides}</div></div>`;
    }

    function matchRow(t, m, liveIds) {
      const on = liveIds.has(m.id);
      return `<div class="row"><span class="n ${nameCls(m, m.a)}">${esc(m.a ?? '…')}</span>
        ${on ? '<span class="tag">EN COURS</span>' : `<span class="vs">${m.bye ? 'exempt' : 'vs'}</span>`}
        <span class="n r ${nameCls(m, m.b)}">${esc(m.bye ? '' : (m.b ?? '…'))}</span></div>`;
    }

    function render(board) {
      const t = board.state;
      const live = (board.live || []).filter(e => t.matches[e.match] && !t.matches[e.match].winner);
      const liveIds = new Set(live.map(e => e.match));
      const [played, total] = progress(t);
      const s = t.settings || {};
      const extra = t.gameId === 'x01' ? ` ${s.startScore ?? 501}${s.doubleOut ? ' · Double out' : ''}` : '';

      let left = '';
      if (t.champion) {
        left += `<div class="card champion"><div class="cup">🏆</div><b>${esc(t.champion)}</b><span>remporte le tournoi !</span></div>`;
      }
      if (live.length) left += `<div><h2 class="live">EN DIRECT</h2>${live.map(e => liveCard(t, e)).join('')}</div>`;
      const next = playable(t).filter(m => !liveIds.has(m.id)).slice(0, 6);
      if (!t.champion) {
        left += `<div><h2>PROCHAINS MATCHS</h2><div class="card">${next.length
          ? next.map(m => `<div class="row"><span class="n">${esc(m.a)}</span><span class="vs">vs</span><span class="n r">${esc(m.b)}</span><span class="vs">${esc(stageOf(t, m))}</span></div>`).join('')
          : '<div class="empty">En attente des matchs en cours…</div>'}</div></div>`;
      }

      let right = '';
      if (t.pools.length) {
        const qualifiers = t.format === 'pools' ? (t.qualifiers ?? 2) : 1;
        right += `<div><h2>${t.pools.length > 1 ? 'POULES' : 'CLASSEMENT'}</h2><div class="pools">${t.pools.map(p => `
          <div class="card"><h2>${esc(p.name.toUpperCase())}</h2><table>${poolStandings(t, p).map((r, i) => `
            <tr class="${i < qualifiers && t.format === 'pools' ? 'q' : ''}"><td class="pos">${i + 1}</td><td class="nm">${esc(r.name)}</td><td class="st">${r.wins} V · ${r.played} J${r.rest ? ` · reste ${r.rest}` : ''}</td></tr>`).join('')}
          </table></div>`).join('')}</div></div>`;
      }
      if (t.knockout) {
        right += `<div><h2>${esc(t.knockout.title.toUpperCase())}</h2><div class="bracket">${t.knockout.rounds.map((round, ri) => `
          <div class="round"><h3>${esc(roundLabel(t, ri).toUpperCase())}</h3>${round.map(id => {
            const m = t.matches[id];
            const rest = (n) => (m.winner && m.winner !== n && typeof m.detail?.rest === 'number' ? `<span class="rest">reste ${m.detail.rest}</span>` : '');
            return `<div class="bm ${liveIds.has(id) ? 'on' : ''}"><div class="${nameCls(m, m.a)}">${esc(m.a ?? '…')}${rest(m.a)}</div><div class="${nameCls(m, m.b)}">${esc(m.bye ? '—' : (m.b ?? '…'))}${rest(m.b)}</div></div>`;
          }).join('')}</div>`).join('')}</div></div>`;
      } else if (t.format === 'pools') {
        right += '<div class="empty">La phase finale apparaîtra à la fin des poules.</div>';
      }

      app.innerHTML = `
        <div class="wrap">
          <header>${LOGO}<div class="brand">DARTLAB</div>
            <div class="title"><b>Tournoi ${esc(GAMES[t.gameId] ?? '')}${esc(extra)}</b><span>${esc(FORMATS[t.format] ?? '')} · ${t.players.length} joueurs · ${played}/${total} matchs</span></div>
            <div class="join">Rejoindre : appli DartLab → Jeux → Rejoindre un tournoi<b>${esc(board.code)}</b></div>
          </header>
          <main><div class="col"><div class="fit">${left}</div></div><div class="col"><div class="fit">${right}</div></div></main>
        </div>
        <div class="status" id="status"></div>`;
      fitColumns();
    }

    // Tout doit tenir sur l'écran de la télé : on réduit une colonne trop longue
    function fitColumns() {
      if (innerWidth <= 900) return;
      document.querySelectorAll('.col').forEach(col => {
        const inner = col.firstElementChild;
        inner.style.transform = 'none';
        inner.style.width = '100%';
        const ratio = Math.min(1, col.clientHeight / inner.scrollHeight);
        if (ratio < 1) { inner.style.width = `${100 / ratio}%`; inner.style.transform = `scale(${ratio})`; }
      });
    }
    addEventListener('resize', fitColumns);

    function askCode(message) {
      app.innerHTML = `<div class="ask">${LOGO.replace('<svg', '<svg width="96" height="96"')}
        <h1 style="letter-spacing:4px;margin:0">DARTLAB</h1>
        <p>Affiche le tableau d'un tournoi en direct. Entre le code du tournoi (en haut du tableau dans l'appli).</p>
        ${message ? `<p class="err">${esc(message)}</p>` : ''}
        <input id="code" maxlength="6" placeholder="ABC123" autocomplete="off" autofocus>
        <button id="go">Afficher</button></div>`;
      const input = document.getElementById('code');
      const go = () => { const c = input.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); if (c.length === 6) location.search = `?c=${c}`; };
      document.getElementById('go').onclick = go;
      input.onkeydown = (e) => { if (e.key === 'Enter') go(); };
    }

    let lastVersion = null;
    let lastLive = '';
    async function load() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/tournament_board`, {
          method: 'POST',
          headers: { apikey: KEY, 'Content-Type': 'application/json' },
          body: JSON.stringify({ join_code: code }),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const board = await res.json();
        if (!board) { askCode(`Aucun tournoi en cours avec le code ${code}.`); return false; }
        const liveKey = JSON.stringify(board.live);
        if (board.version !== lastVersion || liveKey !== lastLive) { render(board); lastVersion = board.version; lastLive = liveKey; }
        const st = document.getElementById('status');
        if (st) st.textContent = `Mis à jour à ${new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;
      } catch (e) {
        const st = document.getElementById('status');
        if (st) st.textContent = 'Connexion perdue, nouvel essai…';
        else app.innerHTML = '<div class="ask"><p>Connexion impossible, nouvel essai…</p></div>';
      }
      return true;
    }

    if (code.length !== 6) askCode();
    else load().then(ok => { if (ok) setInterval(load, 4000); });
  </script>
</body>
</html>
